data:
  index.html: |-
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <meta name="description" content="Erfan Aljanabi — Kubernetes, DevOps and Cloud Infrastructure Engineer.">
      <title>Erfan Aljanabi | Professional Portfolio</title>
      <style>
        :root{
          --bg:#0b0f14;
          --panel:#111820;
          --panel-2:#0e141b;
          --line:#28323d;
          --text:#d7dee7;
          --muted:#8f9baa;
          --green:#67d391;
          --blue:#78a9ff;
          --white:#f4f7fa;
          --max:1080px;
        }
        *{box-sizing:border-box}
        html{scroll-behavior:smooth;scroll-padding-top:74px}
        body{
          margin:0;
          background:var(--bg);
          color:var(--text);
          font:15px/1.7 "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
        }
        a{color:var(--blue);text-decoration:none}
        a:hover{text-decoration:underline}
        .shell{width:min(var(--max),calc(100% - 32px));margin-inline:auto}
        .topbar{
          position:sticky;
          top:0;
          z-index:20;
          background:rgba(11,15,20,.96);
          border-bottom:1px solid var(--line);
        }
        .nav{
          min-height:64px;
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:24px;
        }
        .brand{color:var(--white);font-weight:700}
            .navlinks{display:flex;align-items:center;gap:20px;font-size:.84rem}
        .navlinks a{color:var(--muted)}
        .navlinks a:hover{color:var(--white);text-decoration:none}
        .resume-link{
          padding:8px 12px;
          border:1px solid var(--line);
          border-radius:6px;
          color:var(--white)!important;
        }
        .hero{
          padding:72px 0 54px;
          border-bottom:1px solid var(--line);
        }
        h1{
          margin:0;
          color:var(--white);
          font-size:clamp(2.7rem,7vw,5.5rem);
          line-height:1;
          letter-spacing:-.06em;
        }
        .role{
          margin-top:18px;
          max-width:850px;
          color:#b8c2ce;
          font-size:clamp(1rem,2vw,1.25rem);
        }
        .summary{
          margin-top:24px;
          max-width:850px;
          color:var(--muted);
        }
        .contact{
          margin-top:30px;
          display:flex;
          flex-wrap:wrap;
          gap:10px 24px;
          font-size:.88rem;
        }
        .contact span{color:var(--muted)}
        .contact strong{color:var(--text);font-weight:500}
        .actions{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px}
        .button{
          display:inline-flex;
          align-items:center;
          min-height:40px;
          padding:0 14px;
          border:1px solid var(--line);
          border-radius:6px;
          color:var(--text);
          background:var(--panel);
          font-weight:700;
        }
        .button.primary{
          color:#07110b;
          border-color:var(--green);
          background:var(--green);
        }
        .button:hover{text-decoration:none;filter:brightness(1.06)}
        .section{padding:48px 0;border-bottom:1px solid var(--line)}
        .section-heading{
          display:flex;
          align-items:center;
          margin-bottom:26px;
          padding-bottom:12px;
          border-bottom:1px solid var(--line);
        }
        .section-heading h2{
          margin:0;
          color:var(--white);
          font-size:1.35rem;
          letter-spacing:-.02em;
        }
        .panel{
          border:1px solid var(--line);
          background:var(--panel-2);
          border-radius:8px;
          overflow:hidden;
        }
        .panel-head{
          display:flex;
          gap:8px;
          padding:10px 14px;
          border-bottom:1px solid var(--line);
          color:var(--muted);
          font-size:.78rem;
        }
        .panel-body{padding:24px}
        .grid-two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
        .entry+.entry{
          margin-top:22px;
          padding-top:22px;
          border-top:1px dashed var(--line);
        }
        .entry-title{color:var(--white);font-weight:700}
        .entry-sub{color:var(--blue);margin-top:3px}
        .entry-meta{color:var(--muted);font-size:.84rem;margin-top:4px}
        .experience{display:grid;gap:16px}
        .job{
          display:grid;
          grid-template-columns:230px 1fr;
          gap:28px;
          padding:28px;
          border:1px solid var(--line);
          background:var(--panel-2);
          border-radius:8px;
        }
        .company{color:var(--white);font-weight:700;font-size:1rem}
        .position{color:var(--blue);margin-top:4px}
        .meta{color:var(--muted);font-size:.82rem;margin-top:8px}
        .job ul{margin:0;padding-left:20px}
        .job li+li{margin-top:7px}
        .skills{
          width:100%;
          border-collapse:collapse;
          font-size:.9rem;
        }
        .skills th,.skills td{
          padding:13px 14px;
          border-bottom:1px solid var(--line);
          text-align:left;
          vertical-align:top;
        }
        .skills tr:last-child td{border-bottom:0}
        .skills th{color:var(--muted);font-weight:500;background:#0c1218}
        .skills td:first-child{width:31%;color:var(--green);font-weight:700}
        .references-note{
          margin-top:24px;
          text-align:center;
          color:var(--muted);
          font-style:italic;
          font-size:.9rem;
        }
        .footer{
          padding:30px 0 38px;
          display:flex;
          justify-content:space-between;
          gap:20px;
          color:var(--muted);
          font-size:.82rem;
        }
        .footer-links{display:flex;flex-wrap:wrap;gap:18px}
        @media(max-width:760px){
          .navlinks a:not(.resume-link){display:none}
          .grid-two{grid-template-columns:1fr}
          .job{grid-template-columns:1fr}
          .hero{padding-top:48px}
          .skills th:nth-child(2),.skills td:nth-child(2){display:none}
          .skills td:first-child{width:42%}
          .footer{flex-direction:column}
        }
      </style>
    </head>
    <body>
      <header class="topbar">
        <nav class="nav shell" aria-label="Primary navigation">
          <a class="brand" href="#top">Erfan Aljanabi</a>
          <div class="navlinks">
            <a href="#education">Education</a>
            <a href="#certifications">Certifications</a>
            <a href="#experience">Experience</a>
            <a href="#skills">Skills</a>
            <!-- UPDATED LINK BELOW -->
            <a class="resume-link" href="erfan-resume.docx" download="Erfan_Aljanabi_Resume.docx">Resume</a>
          </div>
        </nav>
      </header>

      <main id="top">
        <section class="hero">
          <div class="shell">
            <h1>Erfan Aljanabi</h1>
            <div class="role">Cloud Infrastructure · Kubernetes · SRE · DevOps Engineering</div>

            <div class="contact">
              <span>location: <strong>Austin, Texas</strong></span>
              <span>status: <strong>U.S. Citizen</strong></span>
              <span>email: <a href="mailto:erf.jan.us@gmail.com">erf.jan.us@gmail.com</a></span>
              <span>phone: <a href="tel:+15125089167">+1 (512) 508-9167</a></span>
            </div>

            <div class="actions">
              <!-- UPDATED LINK BELOW -->
              <a class="button primary" href="erfan-resume.docx" download="Erfan_Aljanabi_Resume.docx">Download Resume</a>
              <a class="button" href="https://www.linkedin.com/in/erfan-aljanabi-826b2431/" target="_blank" rel="noreferrer">LinkedIn</a>
              <a class="button" href="https://github.com/erfanaljanabi" target="_blank" rel="noreferrer">GitHub</a>
            </div>
          </div>
        </section>

        <section class="section" id="education">
          <div class="shell">
            <div class="section-heading">
              <h2>Education & Certifications</h2>
            </div>
            <div class="grid-two">
              <article class="panel">
                <div class="panel-head">Education</div>
                <div class="panel-body">
                  <div class="entry">
                    <div class="entry-title">The University of Texas at Austin</div>
                    <div class="entry-sub">Certificate Program in Cybersecurity Professional</div>
                    <div class="entry-meta">Austin, Texas · 2019–2020</div>
                  </div>
                  <div class="entry">
                    <div class="entry-title">University of Technology</div>
                    <div class="entry-sub">BSc. in Control and Systems Engineering – 4 Years, Graduated.</div>
                    <div class="entry-meta">Baghdad, Iraq · 1998–2002</div>
                  </div>
                </div>
              </article>

              <article class="panel" id="certifications">
                <div class="panel-head">Certifications</div>
                <div class="panel-body">
                  <div class="entry">
                    <div class="entry-title">Certified Kubernetes Application Developer</div>
                    <div class="entry-sub">CKAD · Linux Foundation · 2026</div>
                    <div class="entry-meta">Credential ID: LF-0sorfx0qn6</div>
                  </div>
                  <div class="entry">
                    <div class="entry-title">Certified Kubernetes Administrator</div>
                    <div class="entry-sub">CKA · Linux Foundation · 2026</div>
                    <div class="entry-meta">Credential ID: LF-59j61d8y14</div>
                  </div>
                  <div class="entry">
                    <div class="entry-title">CompTIA Security+</div>
                    <div class="entry-sub">CompTIA · 2020</div>
                    <div class="entry-meta">Credential ID: COMP001021743027</div>
                  </div>
                  <div class="entry">
                    <div class="entry-title">Cisco Certified Network Associate</div>
                    <div class="entry-sub">CCNA · Cisco Inc. · 2021</div>
                    <div class="entry-meta">Certification ID: CSCO13726122</div>
                  </div>
                </div>
              </article>
            </div>
          </div>
        </section>

        <section class="section" id="experience">
          <div class="shell">
            <div class="section-heading">
              <h2>Professional Experience</h2>
            </div>

            <div class="experience">
              <article class="job">
                <div>
                  <div class="company">Dell</div>
                  <div class="position">Technical Lead (contract)</div>
                  <div class="meta">USA Remote<br>Oct 2025 – Present</div>
                </div>
                <ul>
                  <li>Supported internal Kubernetes infrastructure on Google Cloud Platform (GKE), including cluster installation, maintenance, upgrades, and migration of nodes and applications from on-prem to GKE.</li>
                  <li>Built and managed monitoring and observability systems for Kubernetes clusters and VMs using the Prometheus stack. Responsibilities included installation, configuration, upgrades, rule creation, alerting strategies, and seamless integration.</li>
                  <li>Implemented and managed GitOps workflows for Kubernetes-based applications using ArgoCD, Helm, and source control tools like GitHub and Bitbucket.</li>
                  <li>Onboarded and maintained many CNCF projects such as cert-manager, External Secrets, Traefik, Istio (service mesh), chaos-mesh, Kiali, etc. to deliver reliable infrastructure and observability solutions.</li>
                </ul>
              </article>

              <article class="job">
                <div>
                  <div class="company">AMD</div>
                  <div class="position">Senior Test Automation Engineer (contract)</div>
                  <div class="meta">USA Remote<br>May 2023 – Oct 2025</div>
                </div>
                <ul>
                  <li>Developed and executed test plans to validate software functionality against business and technical requirements.</li>
                  <li>Performed functional, regression, performance, and security testing while identifying, tracking, and resolving defects with development teams.</li>
                  <li>Collaborated in Agile development and CI/CD environments to support software quality and release readiness.</li>
                  <li>Validated applications deployed in Linux and Kubernetes environments using Helm, while supporting deployment verification and configuration validation.</li>
                  <li>Utilized Prometheus for basic application and infrastructure monitoring during testing and contributed to test automation and continuous quality improvement.</li>
                </ul>
              </article>

              <article class="job">
                <div>
                  <div class="company">IBM</div>
                  <div class="position">AIX Linux System Engineer (contract)</div>
                  <div class="meta">Austin, Texas<br>Apr 2021 – May 2023</div>
                </div>
                <ul>
                  <li>Supported automated infrastructure provisioning for development teams across on-premises and AWS environments using Kubernetes, EKS, Helm, and the Prometheus monitoring stack.</li>
                  <li>Maintained Linux-based systems and provided infrastructure support to ensure reliable development environments.</li>
                  <li>Served as the Linux Subject Matter Expert (SME), mentoring new team members and supporting technical knowledge sharing.</li>
                </ul>
              </article>

              <article class="job">
                <div>
                  <div class="company">Google</div>
                  <div class="position">Data Analyst (contract)</div>
                  <div class="meta">Austin, Texas<br>Aug 2018 – Apr 2021</div>
                </div>
                <ul>
                  <li>Analyzed and reviewed high-volume content using internal tools, performing data validation and policy compliance verification to maintain platform quality.</li>
                  <li>Investigated complex issues through root cause analysis, documented findings, and collaborated with cross-functional engineering and operations teams to resolve escalations.</li>
                  <li>Improved operational efficiency by leveraging technical workflows, data analysis, and process optimization while maintaining high accuracy and quality standards.</li>
                </ul>
              </article>

              <article class="job">
                <div>
                  <div class="company">Itisaluna EMEA</div>
                  <div class="position">Core Network Senior Engineer (Full time)</div>
                  <div class="meta">The Middle East (remote)<br>Aug 2014 – March 2018</div>
                </div>
                <ul>
                  <li>Managed and supported CDMA core network (NSS) infrastructure, ensuring high availability and reliable network services.</li>
                  <li>Performed network configuration, fault isolation, performance analysis, and root cause troubleshooting across core network elements.</li>
                  <li>Administered Linux-based systems, executed maintenance activities, and collaborated with cross-functional teams to support network upgrades and service deployments.</li>
                  <li>Utilized scripting and automation tools to streamline operational tasks, generate reports, and improve network monitoring and operational efficiency.</li>
                  <li>Improved operational efficiency by leveraging technical workflows, data analysis, and process optimization while maintaining high accuracy and quality standards.</li>
                </ul>
              </article>

              <article class="job">
                <div>
                  <div class="company">Ericsson EMEA</div>
                  <div class="position">Core Network Engineer (Full time)</div>
                  <div class="meta">The Middle East<br>Apr 2005 – Jul. 2014</div>
                </div>
                <ul>
                  <li>Configured, maintained, and supported Ericsson CDMA core network elements, ensuring high availability and reliable voice and data services.</li>
                  <li>Performed fault isolation, performance analysis, software upgrades, and root cause troubleshooting across Linux-based telecom infrastructure.</li>
                  <li>Collaborated with cross-functional teams to support network integration, deployment, and operational improvements while meeting SLA targets.</li>
                </ul>
              </article>
            </div>
          </div>
        </section>

        <section class="section" id="skills">
          <div class="shell">
            <div class="section-heading">
              <h2>Technical Skills</h2>
            </div>
            <div class="panel">
              <table class="skills">
                <thead>
                  <tr>
                    <th>AREA</th>
                    <th>FOCUS</th>
                    <th>TOOLS & TECHNOLOGIES</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>Cloud Platforms</td>
                    <td>Cloud infrastructure</td>
                    <td>Google Cloud Platform (GCP), Amazon Web Services (AWS)</td>
                  </tr>
                  <tr>
                    <td>Containerization &amp; Orchestration</td>
                    <td>Containers and Kubernetes platforms</td>
                    <td>Kubernetes (GKE, EKS), Docker, Helm</td>
                  </tr>
                  <tr>
                    <td>GitOps &amp; Infrastructure as Code</td>
                    <td>Declarative delivery and automation</td>
                    <td>Argo CD, GitOps, Terraform</td>
                  </tr>
                  <tr>
                    <td>Networking &amp; Service Mesh</td>
                    <td>Connectivity and traffic management</td>
                    <td>Istio Service Mesh, Traefik, Kubernetes Networking, Ingress, DNS, TLS/mTLS</td>
                  </tr>
                  <tr>
                    <td>Observability &amp; Reliability</td>
                    <td>Monitoring, alerting, and resilience</td>
                    <td>Prometheus, Grafana, Alertmanager, Kiali, Chaos Engineering, Chaos Mesh</td>
                  </tr>
                  <tr>
                    <td>Security &amp; Policy Management</td>
                    <td>Cluster security and governance</td>
                    <td>Kyverno (Kubernetes Cluster Policies), Kubernetes RBAC, cert-manager, External Secrets Operator, Cybersecurity</td>
                  </tr>
                  <tr>
                    <td>CI/CD &amp; Version Control</td>
                    <td>Source control and delivery pipelines</td>
                    <td>Git, GitHub, GitLab, Bitbucket, CI/CD Pipelines</td>
                  </tr>
                  <tr>
                    <td>Operating Systems</td>
                    <td>System administration</td>
                    <td>Linux (RHEL, Ubuntu, CentOS, Debian), AIX</td>
                  </tr>
                  <tr>
                    <td>Programming &amp; Automation</td>
                    <td>Scripting and automation</td>
                    <td>Python, Bash/Shell</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="references-note">“References will be submitted upon request”</div>
          </div>
        </section>
      </main>

      <footer class="shell footer">
        <div>Erfan Aljanabi · resume.erfan-us.info</div>
        <div class="footer-links">
          <a href="mailto:erf.jan.us@gmail.com">Email</a>
          <a href="https://www.linkedin.com/in/erfan-aljanabi-826b2431/" target="_blank" rel="noreferrer">LinkedIn</a>
          <a href="https://github.com/erfanaljanabi" target="_blank" rel="noreferrer">GitHub</a>
        </div>
      </footer>
    </body>
    </html>
